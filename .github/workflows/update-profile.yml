name: Refresh profile card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_profile.py"
      - "assets/profile.jpg"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build light and dark profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/build_profile.py

      - name: Commit refreshed stats when they changed
        run: |
          if git diff --quiet -- assets/profile-light.svg assets/profile-dark.svg; then
            echo "Profile card is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-light.svg assets/profile-dark.svg
          git commit -m "chore: refresh profile card"
          git push
